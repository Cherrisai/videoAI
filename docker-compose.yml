x-provider-env: &provider-env
  DEMO_MODE: ${DEMO_MODE:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
  GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-qwen/qwen3.8-27b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
  CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
  CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
  CUSTOM_VISION_MODEL: ${CUSTOM_VISION_MODEL:-}
  CUSTOM_CHAT_MODEL: ${CUSTOM_CHAT_MODEL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-gemini-3.8-flash}
  GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
  WHISPER_API_KEY: ${WHISPER_API_KEY:-}
  WHISPER_BASE_URL: ${WHISPER_BASE_URL:-}
  WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
  TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
  TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-}
  TRANSLATION_MODEL: ${TRANSLATION_MODEL:-}
  TRANSLATION_LANGUAGES: ${TRANSLATION_LANGUAGES:-}
  TTS_API_KEY: ${TTS_API_KEY:-}
  TTS_BASE_URL: ${TTS_BASE_URL:-}
  TTS_MODEL: ${TTS_MODEL:-}
  TTS_LANGUAGES: ${TTS_LANGUAGES:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-[]}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  ALLOWED_VIDEO_EXTENSIONS: ${ALLOWED_VIDEO_EXTENSIONS:-.mp4,.mov,.mkv,.webm,.avi}

services:
  frontend:
    build: ./frontend
    ports: ["${STREAMLIT_HOST_PORT:-8501}:8501"]
    environment:
      API_BASE_URL: http://api:8000/api
      API_PUBLIC_URL: "http://localhost:${API_HOST_PORT:-8000}/api"
    depends_on: [api]
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_HOST_PORT:-8000}:8000"]
    environment:
      <<: *provider-env
      DATABASE_URL: postgresql+psycopg://videosense:videosense@postgres:5432/videosense
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes: ["video_data:/data"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    build: ./backend
    command: ["rq", "worker", "videos", "--url", "redis://redis:6379/0"]
    environment:
      <<: *provider-env
      DATABASE_URL: postgresql+psycopg://videosense:videosense@postgres:5432/videosense
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes: ["video_data:/data"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  redis:
    image: redis:7.4-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: videosense, POSTGRES_USER: videosense, POSTGRES_PASSWORD: videosense}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U videosense -d videosense"], interval: 5s, timeout: 3s, retries: 20}
volumes:
  postgres_data:
  video_data:
